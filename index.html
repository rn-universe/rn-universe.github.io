<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RN System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #space {
            position: fixed;
            inset: 0;
        }

        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            color: white;
            z-index: 10;
            font-family: Arial, Helvetica, sans-serif;
        }

        #logo {
            position: absolute;
            top: 24px;
            left: 28px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: .18em;
        }

        #subtitle {
            margin-top: 5px;
            font-size: 8px;
            letter-spacing: .28em;
            color: rgba(255,255,255,.45);
        }

        #instructions {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: rgba(255,255,255,.35);
            white-space: nowrap;
        }

        #info {
            position: absolute;
            right: 28px;
            bottom: 28px;
            width: 220px;
            padding: 18px;
            border: 1px solid rgba(255,255,255,.12);
            background: rgba(0,0,0,.65);
            backdrop-filter: blur(12px);
            opacity: 0;
            transform: translateY(10px);
            transition: .3s ease;
        }

        #info.show {
            opacity: 1;
            transform: translateY(0);
        }

        #info h2 {
            margin: 0 0 7px;
            font-size: 15px;
            font-weight: 500;
        }

        #info p {
            margin: 0;
            font-size: 10px;
            line-height: 1.6;
            color: rgba(255,255,255,.55);
        }

        @media (max-width: 600px) {
            #logo {
                top: 18px;
                left: 18px;
            }

            #instructions {
                bottom: 18px;
                font-size: 8px;
            }

            #info {
                right: 15px;
                left: 15px;
                bottom: 55px;
                width: auto;
            }
        }
    </style>

    <!-- THREE.JS IMPORT MAP -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

</head>

<body>

<div id="space"></div>

<div id="ui">

    <div id="logo">
        RN
        <div id="subtitle">SYSTEM</div>
    </div>

    <div id="instructions">
        drag · zoom · explore
    </div>

    <div id="info">
        <h2 id="infoTitle"></h2>
        <p id="infoText"></p>
    </div>

</div>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x000000);


/* =========================
   CAMERA
========================= */

const camera =
    new THREE.PerspectiveCamera(
        55,
        window.innerWidth /
        window.innerHeight,
        0.1,
        5000
    );

camera.position.set(
    0,
    90,
    220
);


/* =========================
   RENDERER
========================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document
    .getElementById("space")
    .appendChild(
        renderer.domElement
    );


/* =========================
   CONTROLS
========================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.minDistance = 30;

controls.maxDistance = 700;


/* =========================
   LIGHT
========================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        0.35
    )
);


/* =========================
   RN SUN
========================= */

const sun =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            14,
            48,
            48
        ),

        new THREE.MeshBasicMaterial({
            color: 0xffffff
        })
    );

scene.add(sun);


/* =========================
   SUN GLOW
========================= */

const glow =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            20,
            48,
            48
        ),

        new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.08
        })
    );

scene.add(glow);


/* =========================
   PLANETS
========================= */

const planets = [];


function createPlanet(
    name,
    distance,
    size,
    speed,
    description
) {

    const orbit =
        new THREE.Object3D();

    scene.add(orbit);


    const planet =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                size,
                32,
                32
            ),

            new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.8
            })
        );


    planet.position.x =
        distance;


    planet.userData = {
        name,
        description
    };


    orbit.add(planet);


    planets.push({
        orbit,
        planet,
        speed
    });


    createOrbit(distance);
}


/* =========================
   ORBIT
========================= */

function createOrbit(radius) {

    const points = [];


    for (
        let i = 0;
        i <= 128;
        i++
    ) {

        const angle =
            (i / 128) *
            Math.PI *
            2;


        points.push(
            new THREE.Vector3(
                Math.cos(angle) *
                radius,

                0,

                Math.sin(angle) *
                radius
            )
        );
    }


    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(
                points
            );


    const material =
        new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.10
        });


    scene.add(
        new THREE.LineLoop(
            geometry,
            material
        )
    );
}


/* =========================
   RN SYSTEM OBJECTS
========================= */

createPlanet(
    "PROJECTS",
    38,
    4,
    0.006,
    "Everything you build."
);

createPlanet(
    "EXPERIMENTS",
    65,
    5,
    0.004,
    "Strange ideas brought to life."
);

createPlanet(
    "IDEAS",
    95,
    6,
    0.0025,
    "Things you're thinking about."
);

createPlanet(
    "NOTES",
    130,
    7,
    0.0018,
    "Things you're learning."
);

createPlanet(
    "ARCHIVE",
    170,
    5,
    0.0012,
    "Things from the past."
);


/* =========================
   STARS
========================= */

const starPositions = [];


for (
    let i = 0;
    i < 5000;
    i++
) {

    const radius =
        600 +
        Math.random() *
        1000;


    const theta =
        Math.random() *
        Math.PI *
        2;


    const phi =
        Math.acos(
            2 *
            Math.random() -
            1
        );


    starPositions.push(

        radius *
        Math.sin(phi) *
        Math.cos(theta),

        radius *
        Math.cos(phi),

        radius *
        Math.sin(phi) *
        Math.sin(theta)

    );
}


const starGeometry =
    new THREE.BufferGeometry();


starGeometry.setAttribute(
    "position",

    new THREE.Float32BufferAttribute(
        starPositions,
        3
    )
);


const stars =
    new THREE.Points(

        starGeometry,

        new THREE.PointsMaterial({
            color: 0xffffff,
            size: 1,
            sizeAttenuation: true
        })

    );


scene.add(stars);


/* =========================
   CLICK DETECTION
========================= */

const raycaster =
    new THREE.Raycaster();

const pointer =
    new THREE.Vector2();


const info =
    document.getElementById(
        "info"
    );

const infoTitle =
    document.getElementById(
        "infoTitle"
    );

const infoText =
    document.getElementById(
        "infoText"
    );


window.addEventListener(
    "pointerdown",
    event => {

        pointer.x =
            (
                event.clientX /
                window.innerWidth
            ) * 2 - 1;


        pointer.y =
            -(
                event.clientY /
                window.innerHeight
            ) * 2 + 1;


        raycaster.setFromCamera(
            pointer,
            camera
        );


        const hits =
            raycaster.intersectObjects(
                planets.map(
                    p => p.planet
                )
            );


        if (hits.length) {

            const object =
                hits[0].object;


            infoTitle.textContent =
                object.userData.name;


            infoText.textContent =
                object.userData.description;


            info.classList.add(
                "show"
            );

        } else {

            info.classList.remove(
                "show"
            );

        }
    }
);


/* =========================
   ANIMATION
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    planets.forEach(
        item => {

            item.orbit.rotation.y +=
                item.speed;

        }
    );


    stars.rotation.y +=
        0.00005;


    controls.update();


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
