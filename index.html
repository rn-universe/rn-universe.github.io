<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#03050a" />
  <meta name="description" content="RN Universe by Aryan Bhagwan Patil." />
  <title>RN UNIVERSE · RIGHT NOW</title>
  <link rel="stylesheet" href="./src/styles.css?v=reset-2" />
</head>
<body>
  <main id="app">
    <div id="space" aria-label="RN Universe 3D space"></div>
    <div id="loader"><div class="loader-title">RN UNIVERSE</div><div class="loader-sub">STARTING 3D SPACE</div></div>
    <header class="topbar">
      <div class="brand"><strong>RN</strong><span>UNIVERSE</span></div>
      <button id="reset-camera" type="button">RESET VIEW</button>
      <button id="help" type="button">?</button>
    </header>
    <div class="hud"><span>DRAG</span><i>ORBIT</i><span>SCROLL</span><i>ZOOM</i><span>TAP</span><i>SELECT</i></div>
    <section id="card" class="card hidden">
      <button id="close" class="close" type="button" aria-label="Close">×</button>
      <div id="card-kicker">RN OBJECT</div>
      <h1 id="card-title"></h1>
      <p id="card-copy"></p>
    </section>
    <div id="toast" class="toast"></div>
  </main>
  <script>
    window.addEventListener('error', function (event) {
      const loader = document.getElementById('loader');
      const toast = document.getElementById('toast');
      if (loader) loader.classList.add('hidden');
      if (toast) {
        toast.textContent = '3D ERROR · RELOAD';
        toast.classList.add('visible');
      }
      console.error(event.error || event.message);
    });
  </script>
  <script type="module" src="./src/main.js?v=reset-2"></script>
</body>
</html>
