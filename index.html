<body>
  <div id="app">
    <div id="star-layer" aria-hidden="true"><canvas id="star-canvas"></canvas></div>
    <div id="space" aria-label="Interactive 3D RN SYSTEM environment"></div>
    <div id="ui">
      <header class="brand" aria-label="RN SYSTEM"><div class="brand-mark">RN</div><div class="brand-sub">SYSTEM</div><div class="brand-line"></div></header>
      <div class="live-status" aria-label="System status"><span class="live-dot" aria-hidden="true"></span><span>LIVE</span><span class="live-divider">·</span><span>WEBGL</span></div>
      <nav class="scale-nav" aria-label="Scale navigation"><button class="scale-btn active" data-scale="rn" type="button">RN SYSTEM</button><button class="scale-btn" data-scale="solar" type="button">SOLAR</button><button class="scale-btn" data-scale="galaxy" type="button">MILKY WAY</button></nav>
      <div class="scale-readout" aria-live="polite"><span id="scale-name" class="scale-name">RN SYSTEM</span><span id="scale-detail" class="scale-detail">close orbit</span></div>
      <div class="journey-hint" aria-hidden="true"><span class="journey-key">1</span><span>RN</span><span class="journey-arrow">→</span><span class="journey-key">2</span><span>SOLAR</span><span class="journey-arrow">→</span><span class="journey-key">3</span><span>MILKY WAY</span></div>
      <div class="instructions">DRAG <span>·</span> ZOOM <span>·</span> EXPLORE</div>
      <div id="focus-label" aria-hidden="true"></div>
      <aside id="panel" aria-live="polite" aria-label="Selected system object"><button id="panel-close" class="panel-close" type="button" aria-label="Close information panel">×</button><div id="panel-kicker" class="panel-kicker"></div><h2 id="panel-title" class="panel-title"></h2><p id="panel-description" class="panel-description"></p><div id="panel-fields" class="panel-fields"></div><div id="panel-extra"></div><div class="panel-footer">SELECT A DIFFERENT ORBIT TO CONTINUE</div></aside>
    </div>
    <div id="loader" role="status" aria-live="polite"><div class="loader-inner"><div class="loader-mark">RN</div><div class="loader-status">INITIALIZING SYSTEM...</div><div class="loader-bar"></div></div></div>
    <div id="fallback" role="alert"><div class="fallback-copy"><h1>RN SYSTEM</h1><p>This environment needs WebGL to render the system. Try a current version of Chrome, Safari or Firefox with hardware acceleration enabled.</p></div></div>
  </div>
  <script>
    window.addEventListener('error', function (event) {
      if (!event.filename || /main\.js|three|OrbitControls/.test(event.filename) || /module|WebGL|THREE/.test(event.message || '')) {
        var loader = document.getElementById('loader');
        var fallback = document.getElementById('fallback');
        if (loader) loader.classList.add('hidden');
        if (fallback) fallback.classList.add('visible');
      }
    });
    window.addEventListener('unhandledrejection', function () {
      var loader = document.getElementById('loader');
      var fallback = document.getElementById('fallback');
      if (loader) loader.classList.add('hidden');
      if (fallback) fallback.classList.add('visible');
    });
  </script>
  <script type="module" src="./src/main.js?v=20260915-7"></script>
</body>
</html>
