<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RN Universe</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020204;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: white;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .noise {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.035;
            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
        }

        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            pointer-events: none;
        }

        .identity {
            transform: translateY(10px);
            opacity: 0;
            animation: appear 2s cubic-bezier(.16,1,.3,1) forwards;
        }

        .rn {
            font-size: clamp(90px, 20vw, 240px);
            font-weight: 700;
            letter-spacing: -0.09em;
            line-height: .8;
            margin-right: .09em;

            text-shadow:
                0 0 40px rgba(255,255,255,.08),
                0 0 100px rgba(255,255,255,.04);
        }

        .meaning {
            margin-top: 34px;
            font-size: 11px;
            letter-spacing: .45em;
            text-transform: uppercase;
            color: rgba(255,255,255,.48);
            margin-left: .45em;
        }

        .name {
            position: fixed;
            bottom: 30px;
            left: 30px;

            font-size: 10px;
            letter-spacing: .25em;
            text-transform: uppercase;

            color: rgba(255,255,255,.35);

            z-index: 3;
        }

        .status {
            position: fixed;
            bottom: 30px;
            right: 30px;

            display: flex;
            align-items: center;
            gap: 8px;

            font-size: 10px;
            letter-spacing: .18em;
            text-transform: uppercase;

            color: rgba(255,255,255,.35);

            z-index: 3;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 12px rgba(255,255,255,.8);
        }

        .hint {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);

            font-size: 9px;
            letter-spacing: .3em;
            text-transform: uppercase;

            color: rgba(255,255,255,.18);

            z-index: 3;

            animation: fadeHint 4s ease forwards;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.97);
                filter: blur(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes fadeHint {
            0% {
                opacity: 0;
            }

            25% {
                opacity: 1;
            }

            75% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .name {
                left: 20px;
                bottom: 20px;
            }

            .status {
                right: 20px;
                bottom: 20px;
            }

            .meaning {
                margin-top: 28px;
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

    <canvas id="universe"></canvas>

    <div class="noise"></div>

    <div class="hint">
        move through the universe
    </div>

    <main class="content">
        <div class="identity">
            <div class="rn">RN</div>

            <div class="meaning">
                right now
            </div>
        </div>
    </main>

    <div class="name">
        Aryan Bhagwan Patil
    </div>

    <div class="status">
        <span class="dot"></span>
        online
    </div>

    <script>
        const canvas = document.getElementById("universe");
        const ctx = canvas.getContext("2d");

        let width;
        let height;
        let stars = [];

        const mouse = {
            x: window.innerWidth / 2,
            y: window.innerHeight / 2
        };

        function resize() {
            width = canvas.width = window.innerWidth * devicePixelRatio;
            height = canvas.height = window.innerHeight * devicePixelRatio;

            canvas.style.width = window.innerWidth + "px";
            canvas.style.height = window.innerHeight + "px";

            ctx.setTransform(
                devicePixelRatio,
                0,
                0,
                devicePixelRatio,
                0,
                0
            );

            createStars();
        }

        function createStars() {
            stars = [];

            const count = Math.min(
                500,
                Math.floor(window.innerWidth * window.innerHeight / 6000)
            );

            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    size: Math.random() * 1.4 + .2,
                    depth: Math.random() * .8 + .2,
                    alpha: Math.random() * .7 + .1,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function draw(time) {
            ctx.clearRect(
                0,
                0,
                window.innerWidth,
                window.innerHeight
            );

            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;

            const mx = (mouse.x - cx) / cx;
            const my = (mouse.y - cy) / cy;

            for (const star of stars) {

                const driftX = mx * star.depth * 18;
                const driftY = my * star.depth * 18;

                const x = star.x + driftX;
                const y = star.y + driftY;

                const pulse =
                    star.alpha +
                    Math.sin(time * 0.001 + star.phase) * .15;

                ctx.beginPath();

                ctx.arc(
                    x,
                    y,
                    star.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    `rgba(255,255,255,${Math.max(.05, pulse)})`;

                ctx.fill();
            }

            requestAnimationFrame(draw);
        }

        window.addEventListener("mousemove", event => {
            mouse.x = event.clientX;
            mouse.y = event.clientY;
        });

        window.addEventListener("touchmove", event => {
            if (event.touches.length > 0) {
                mouse.x = event.touches[0].clientX;
                mouse.y = event.touches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener("resize", resize);

        resize();
        requestAnimationFrame(draw);
    </script>

</body>
</html>
