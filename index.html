<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RN System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, Helvetica, sans-serif;
        }

        #space {
            position: fixed;
            inset: 0;
        }

        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            color: white;
            z-index: 10;
        }

        #logo {
            position: absolute;
            top: 24px;
            left: 28px;

            font-size: 18px;
            font-weight: 600;
            letter-spacing: .18em;
        }

        #subtitle {
            margin-top: 5px;

            font-size: 8px;
            letter-spacing: .28em;
            color: rgba(255,255,255,.45);
        }

        #instructions {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);

            font-size: 9px;
            letter-spacing: .18em;
            text-transform: uppercase;

            color: rgba(255,255,255,.35);
            white-space: nowrap;
        }

        #info {
            position: absolute;

            right: 28px;
            bottom: 28px;

            width: 220px;

            padding: 18px;

            border: 1px solid rgba(255,255,255,.12);

            background: rgba(0,0,0,.55);

            backdrop-filter: blur(12px);

            opacity: 0;

            transform: translateY(10px);

            transition:
                opacity .3s ease,
                transform .3s ease;
        }

        #info.show {
            opacity: 1;
            transform: translateY(0);
        }

        #info h2 {
            margin: 0 0 7px;

            font-size: 15px;
            font-weight: 500;
        }

        #info p {
            margin: 0;

            font-size: 10px;
            line-height: 1.6;

            color: rgba(255,255,255,.55);
        }

        @media (max-width: 600px) {

            #logo {
                top: 18px;
                left: 18px;
            }

            #instructions {
                bottom: 18px;
                font-size: 8px;
            }

            #info {
                right: 15px;
                left: 15px;
                bottom: 55px;
                width: auto;
            }
        }
    </style>
</head>

<body>

<div id="space"></div>

<div id="ui">

    <div id="logo">
        RN
        <div id="subtitle">
            SYSTEM
        </div>
    </div>

    <div id="instructions">
        drag · zoom · explore
    </div>

    <div id="info">
        <h2 id="infoTitle"></h2>
        <p id="infoText"></p>
    </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

import { OrbitControls } from
"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js";


/* --------------------------------
   SCENE
-------------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x000000);


/* --------------------------------
   CAMERA
-------------------------------- */

const camera = new THREE.PerspectiveCamera(
    55,
    window.innerWidth / window.innerHeight,
    0.1,
    5000
);

camera.position.set(
    0,
    120,
    260
);


/* --------------------------------
   RENDERER
-------------------------------- */

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document
    .getElementById("space")
    .appendChild(renderer.domElement);


/* --------------------------------
   CONTROLS
-------------------------------- */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.minDistance = 35;

controls.maxDistance = 700;


/* --------------------------------
   LIGHT
-------------------------------- */

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        0.15
    );

scene.add(ambientLight);


/* --------------------------------
   RN SUN
-------------------------------- */

const sunGeometry =
    new THREE.SphereGeometry(
        16,
        64,
        64
    );

const sunMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffffff
    });

const sun =
    new THREE.Mesh(
        sunGeometry,
        sunMaterial
    );

scene.add(sun);


/* --------------------------------
   SUN GLOW
-------------------------------- */

const glowGeometry =
    new THREE.SphereGeometry(
        21,
        64,
        64
    );

const glowMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.06
    });

const glow =
    new THREE.Mesh(
        glowGeometry,
        glowMaterial
    );

scene.add(glow);


/* --------------------------------
   PLANETS
-------------------------------- */

const planets = [];

function createPlanet(
    name,
    radius,
    distance,
    speed,
    size,
    description
) {

    const geometry =
        new THREE.SphereGeometry(
            size,
            32,
            32
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.8
        });

    const planet =
        new THREE.Mesh(
            geometry,
            material
        );

    planet.userData = {
        name,
        description
    };

    const orbit =
        new THREE.Object3D();

    scene.add(orbit);

    orbit.add(planet);

    planet.position.x = distance;

    planets.push({
        orbit,
        planet,
        speed
    });

    createOrbit(distance);
}


/* --------------------------------
   ORBITS
-------------------------------- */

function createOrbit(radius) {

    const curve =
        new THREE.EllipseCurve(
            0,
            0,
            radius,
            radius,
            0,
            Math.PI * 2,
            false,
            0
        );

    const points =
        curve
            .getPoints(128)
            .map(
                p =>
                    new THREE.Vector3(
                        p.x,
                        0,
                        p.y
                    )
            );

    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(points);

    const material =
        new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.08
        });

    const line =
        new THREE.LineLoop(
            geometry,
            material
        );

    scene.add(line);
}


/* --------------------------------
   CREATE YOUR WORLDS
-------------------------------- */

createPlanet(
    "PROJECTS",
    2,
    42,
    0.006,
    4,
    "Everything you build."
);

createPlanet(
    "EXPERIMENTS",
    2,
    70,
    0.004,
    5,
    "Strange ideas brought to life."
);

createPlanet(
    "IDEAS",
    2,
    100,
    0.0025,
    6,
    "Things you're thinking about."
);

createPlanet(
    "NOTES",
    2,
    135,
    0.0018,
    7,
    "Things you're learning and observing."
);

createPlanet(
    "ARCHIVE",
    2,
    175,
    0.0012,
    5,
    "Things from the past."
);


/* --------------------------------
   STARS
-------------------------------- */

const starGeometry =
    new THREE.BufferGeometry();

const starPositions = [];

for (
    let i = 0;
    i < 5000;
    i++
) {

    const radius =
        600 + Math.random() * 1000;

    const theta =
        Math.random() * Math.PI * 2;

    const phi =
        Math.acos(
            2 * Math.random() - 1
        );

    const x =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    const y =
        radius *
        Math.cos(phi);

    const z =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    starPositions.push(
        x,
        y,
        z
    );
}

starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({
        color: 0xffffff,
        size: 1,
        sizeAttenuation: true
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);


/* --------------------------------
   CLICK DETECTION
-------------------------------- */

const raycaster =
    new THREE.Raycaster();

const pointer =
    new THREE.Vector2();

const info =
    document.getElementById("info");

const infoTitle =
    document.getElementById("infoTitle");

const infoText =
    document.getElementById("infoText");


window.addEventListener(
    "pointerdown",
    event => {

        pointer.x =
            (event.clientX /
                window.innerWidth) * 2 - 1;

        pointer.y =
            -(event.clientY /
                window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(
            pointer,
            camera
        );

        const objects =
            planets.map(
                p => p.planet
            );

        const hits =
            raycaster.intersectObjects(
                objects
            );

        if (hits.length > 0) {

            const object =
                hits[0].object;

            infoTitle.textContent =
                object.userData.name;

            infoText.textContent =
                object.userData.description;

            info.classList.add(
                "show"
            );

        } else {

            info.classList.remove(
                "show"
            );
        }
    }
);


/* --------------------------------
   ANIMATION
-------------------------------- */

function animate() {

    requestAnimationFrame(
        animate
    );

    planets.forEach(
        item => {

            item.orbit.rotation.y +=
                item.speed;
        }
    );

    stars.rotation.y +=
        0.00005;

    controls.update();

    renderer.render(
        scene,
        camera
    );
}

animate();


/* --------------------------------
   RESIZE
-------------------------------- */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
