<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RN System</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #space {
            position: fixed;
            inset: 0;
        }

        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 10;
        }

        #logo {
            position: absolute;
            top: 24px;
            left: 28px;
            font-size: 20px;
            letter-spacing: 0.2em;
        }

        #subtitle {
            margin-top: 6px;
            font-size: 8px;
            letter-spacing: 0.3em;
            color: rgba(255,255,255,.45);
        }

        #instructions {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            letter-spacing: .2em;
            color: rgba(255,255,255,.4);
        }
    </style>
</head>

<body>

<div id="space"></div>

<div id="ui">
    <div id="logo">
        RN
        <div id="subtitle">SYSTEM</div>
    </div>

    <div id="instructions">
        DRAG · ZOOM · EXPLORE
    </div>
</div>


<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.min.js"></script>

<!-- ORBIT CONTROLS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/js/controls/OrbitControls.js"></script>


<script>

console.log("RN SYSTEM STARTING");


/* =========================
   CHECK THREE.JS
========================= */

if (typeof THREE === "undefined") {

    document.body.innerHTML = `
        <div style="
            color:white;
            background:black;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:Arial;
            text-align:center;
        ">
            <div>
                <h2>RN SYSTEM</h2>
                <p>Three.js could not be loaded.</p>
            </div>
        </div>
    `;

    throw new Error("Three.js failed to load.");
}


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x000000);


/* =========================
   CAMERA
========================= */

const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        0.1,
        5000
    );

camera.position.set(
    0,
    80,
    220
);


/* =========================
   RENDERER
========================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document
    .getElementById("space")
    .appendChild(
        renderer.domElement
    );


/* =========================
   CONTROLS
========================= */

const controls =
    new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = 0.05;

controls.minDistance = 25;

controls.maxDistance = 700;


/* =========================
   LIGHT
========================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1
    )
);


/* =========================
   RN SUN
========================= */

const sun =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            15,
            64,
            64
        ),

        new THREE.MeshBasicMaterial({
            color: 0xffffff
        })

    );

scene.add(sun);


/* =========================
   PLANETS
========================= */

function planet(
    distance,
    size,
    speed
) {

    const orbit =
        new THREE.Object3D();

    scene.add(orbit);


    const body =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                size,
                32,
                32
            ),

            new THREE.MeshBasicMaterial({
                color: 0xffffff
            })

        );


    body.position.x =
        distance;


    orbit.add(body);


    return {
        orbit,
        speed
    };
}


const planets = [

    planet(45, 4, 0.006),

    planet(75, 5, 0.004),

    planet(110, 6, 0.002),

    planet(150, 7, 0.0015)

];


/* =========================
   ORBITS
========================= */

function orbitLine(radius) {

    const points = [];

    for (
        let i = 0;
        i < 128;
        i++
    ) {

        const angle =
            i / 128 *
            Math.PI *
            2;

        points.push(
            new THREE.Vector3(
                Math.cos(angle) * radius,
                0,
                Math.sin(angle) * radius
            )
        );
    }


    const geometry =
        new THREE.BufferGeometry()
            .setFromPoints(points);


    const material =
        new THREE.LineBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: .12
        });


    scene.add(
        new THREE.LineLoop(
            geometry,
            material
        )
    );
}


orbitLine(45);
orbitLine(75);
orbitLine(110);
orbitLine(150);


/* =========================
   STARS
========================= */

const positions = [];

for (
    let i = 0;
    i < 4000;
    i++
) {

    const radius =
        500 +
        Math.random() * 1000;

    const theta =
        Math.random() *
        Math.PI * 2;

    const phi =
        Math.acos(
            2 * Math.random() - 1
        );


    positions.push(

        radius *
        Math.sin(phi) *
        Math.cos(theta),

        radius *
        Math.cos(phi),

        radius *
        Math.sin(phi) *
        Math.sin(theta)

    );
}


const starGeometry =
    new THREE.BufferGeometry();


starGeometry.setAttribute(
    "position",

    new THREE.Float32BufferAttribute(
        positions,
        3
    )
);


const starMaterial =
    new THREE.PointsMaterial({

        color: 0xffffff,

        size: 1.2,

        sizeAttenuation: true

    });


const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );


scene.add(stars);


/* =========================
   ANIMATION
========================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    planets.forEach(
        p => {

            p.orbit.rotation.y +=
                p.speed;

        }
    );


    stars.rotation.y +=
        0.00003;


    controls.update();


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
